<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern HTML5 Showcase</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .counter {
      margin-top: 1.5rem;
      font-family: monospace;
      font-size: 1.25rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HTML5 Web Showcase</h1>
    <p>Published seamlessly to GitHub with RepoPilot AI. A lightweight, standalone web document with embedded CSS and modern JavaScript.</p>
    <button class="btn" id="clickBtn">Click Me</button>
    <div class="counter" id="counterDisplay">Clicks: 0</div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById('clickBtn');
    const display = document.getElementById('counterDisplay');

    btn.addEventListener('click', () => {
      count++;
      display.textContent = 'Clicks: ' + count;
    });
  </script>
</body>
</html>
